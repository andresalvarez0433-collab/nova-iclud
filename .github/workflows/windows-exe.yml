name: Crear instalador Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'pc/**'
      - '.github/workflows/windows-exe.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pc/package.json
      - name: Instalar dependencias
        working-directory: pc
        run: npm install
      - name: Crear instalador EXE
        working-directory: pc
        run: npm run dist
      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: NovaCloud-Gaming-Windows
          path: pc/dist/*.exe
          if-no-files-found: error
          retention-days: 30
